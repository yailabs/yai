[package]
name = "yai-engine"
version = "0.0.0-newcore"
edition = "2021"

[lib]
name = "yai_core_engine"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
lmdb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { version = "=0.44.0", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["hooks", "limits", "column_decltype", "serialize"] }
