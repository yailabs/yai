[package]
name = "yai"
version = "0.0.0-newcore"
edition = "2021"

[[bin]]
name = "yai"
path = "src/main.rs"

[dependencies]
yai-engine = { path = "../../engine/yai-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
