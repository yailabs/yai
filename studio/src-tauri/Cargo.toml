[package]
name = "yai-studio"
version = "0.0.0"
edition = "2021"
publish = false

# Independent desktop package; never a member of the engine workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
yai-application = { path = "../../application/yai-application" }
yai-host = { path = "../../application/yai-host" }
