[package]
name = "yai-host"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "yai_host"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yai-application = { path = "../yai-application" }
yai-engine = { path = "../../engine/yai-engine" }
